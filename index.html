<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汉字拼音和笔顺学习</title>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cnchar@3.2.6/cnchar.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      color: white;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
      font-size: 1.5rem;
      text-align: center;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 500px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 12px 15px;
      font-size: 18px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.3s;
      min-width: 0;
    }
    input:focus { border-color: #667eea; }
    button {
      padding: 12px 20px;
      font-size: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
    button:active { transform: translateY(0); }
    .result { display: none; text-align: center; }
    .result.active { display: block; }
    .char-display { font-size: 80px; margin-bottom: 15px; }
    .pinyin { font-size: 24px; color: #667eea; margin-bottom: 20px; }
    #character {
      width: 280px;
      height: 280px;
      margin: 0 auto;
      border: 2px solid #f0f0f0;
      border-radius: 15px;
    }
    .controls {
      display: none;
      gap: 8px;
      justify-content: center;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .controls.active { display: flex; }
    .controls button {
      padding: 10px 16px;
      font-size: 14px;
      background: #f5f5f5;
      color: #333;
    }
    .controls button:hover { background: #667eea; color: white; }

    @media (min-width: 768px) {
      body { padding: 40px 20px; }
      h1 { font-size: 2rem; margin-bottom: 30px; }
      .container { padding: 40px; max-width: 600px; }
      .input-group { margin-bottom: 30px; }
      input { padding: 15px 20px; font-size: 20px; }
      button { padding: 15px 30px; font-size: 18px; }
      .char-display { font-size: 120px; margin-bottom: 20px; }
      .pinyin { font-size: 32px; margin-bottom: 30px; }
      #character { width: 350px; height: 350px; }
      .controls { margin-top: 20px; gap: 10px; }
      .controls button { padding: 12px 20px; font-size: 15px; }
    }

    @media (max-width: 380px) {
      .input-group { flex-direction: column; }
      button { width: 100%; }
      .char-display { font-size: 60px; }
      #character { width: 240px; height: 240px; }
    }
  </style>
</head>
<body>
  <h1>🔤 汉字拼音和笔顺学习</h1>
  <div class="container">
    <div class="input-group">
      <input type="text" id="charInput" placeholder="输入一个汉字..." maxlength="1">
      <button onclick="search()">查询</button>
    </div>
    <div class="result" id="result">
      <div class="char-display" id="charDisplay"></div>
      <div class="pinyin" id="pinyinDisplay"></div>
      <div id="character"></div>
      <div class="controls" id="controls">
        <button onclick="animate()">🔄 播放动画</button>
        <button onclick="quiz()">✍️ 练习模式</button>
      </div>
    </div>
  </div>

  <script>
    function getPinyin(char) {
      try {
        if (typeof cnchar !== 'undefined' && cnchar.spell) {
          var py = char.spell('tone');
          if (py && py !== char) return py;
        }
      } catch (e) {}
      return '?';
    }

    var writer = null;

    function search() {
      var char = document.getElementById('charInput').value.trim();
      if (!char) return alert('请输入一个汉字');

      document.getElementById('result').classList.add('active');
      document.getElementById('charDisplay').textContent = char;
      document.getElementById('pinyinDisplay').textContent = getPinyin(char);
      document.getElementById('controls').classList.add('active');

      createWriter(char);
    }

    function createWriter(char) {
      var el = document.getElementById('character');
      el.innerHTML = '';
      var size = el.clientWidth;

      writer = HanziWriter.create('character', char, {
        width: size,
        height: size,
        padding: 20,
        showOutline: true,
        outlineColor: '#ddd',
        strokeAnimationSpeed: 1,
        delayBetweenStrokes: 300,
        strokeColor: '#333333',
        radicalColor: '#667eea',
        charDataLoader: function(char, onComplete) {
          var url = 'https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/' + encodeURIComponent(char) + '.json';
          var xhr = new XMLHttpRequest();
          xhr.open('GET', url, true);
          xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
              if (xhr.status === 200) {
                onComplete(JSON.parse(xhr.responseText));
              }
            }
          };
          xhr.send();
        },
        onLoadCharDataSuccess: function() {
          writer.animateCharacter();
        }
      });
    }

    function animate() {
      if (writer) writer.animateCharacter();
    }

    function quiz() {
      if (writer) writer.quiz();
    }

    document.getElementById('charInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') search();
    });
  </script>
</body>
</html>

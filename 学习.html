<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉字 "学习" - 拼音: xué xí</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .char-display {
            font-size: 120px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.1);
        }

        .pinyin {
            font-size: 36px;
            color: #e74c3c;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .writers-container {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin: 20px auto;
        }

        .char-box {
            width: 250px;
            height: 250px;
            background: #f8f9fa;
            border-radius: 16px;
            border: 3px dashed #dee2e6;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 3px solid #667eea;
            color: #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
        }

        .info-box {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            text-align: left;
        }

        .info-box h3 {
            color: #2c3e50;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .info-box p {
            color: #7f8c8d;
            line-height: 1.8;
            font-size: 14px;
        }

        .highlight {
            background: linear-gradient(120deg, #a8edea 0%, #fed6e3 100%);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            color: #2c3e50;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="char-display">学习</div>
        <div class="pinyin">xué xí</div>

        <div class="writers-container">
            <div id="character-target-0" class="char-box"></div>
            <div id="character-target-1" class="char-box"></div>
        </div>

        <div class="btn-group">
            <button class="btn-primary" onclick="animateStroke()">
                <span>🎨</span> 显示笔顺
            </button>
            <button class="btn-success" onclick="quizMode()">
                <span>✍️</span> 练习书写
            </button>
            <button class="btn-warning" onclick="slowAnimate()">
                <span>🐌</span> 慢速演示
            </button>
            <button class="btn-outline" onclick="reset()">
                <span>🔄</span> 重置
            </button>
        </div>

        <div class="info-box">
            <h3>💡 使用说明</h3>
            <p>
                • <span class="highlight">显示笔顺</span> - 自动演示汉字的书写顺序<br>
                • <span class="highlight">练习书写</span> - 跟着笔画顺序练习书写<br>
                • <span class="highlight">慢速演示</span> - 以较慢的速度演示笔顺<br>
                • 笔顺数据由 <a href="https://hanziwriter.org/" target="_blank">hanzi-writer</a> 提供
            </p>
        </div>
    </div>

    <script>
        var chars = ["学","习"];
        var writers = [];
        var slowWriters = [];

        // 为每个字符创建 normal 和 slow 两个 writer
        function createWriters(speed, delay) {
            return chars.map(function(c, i) {
                var targetId = 'character-target-' + i;
                document.getElementById(targetId).innerHTML = '';
                return HanziWriter.create(targetId, c, {
                    width: 250,
                    height: 250,
                    padding: 20,
                    showOutline: true,
                    strokeAnimationSpeed: speed,
                    delayBetweenStrokes: delay,
                    strokeColor: '#2c3e50',
                    radicalColor: '#667eea',
                    outlineColor: '#bdc3c7',
                    drawingWidth: 20,
                });
            });
        }

        writers = createWriters(1, 300);

        // 按顺序播放所有字符的动画
        function animateSequential(writerList, index) {
            if (index >= writerList.length) return;
            writerList[index].animateCharacter({
                onComplete: function() {
                    animateSequential(writerList, index + 1);
                }
            });
        }

        // 正常速度演示
        function animateStroke() {
            writers = createWriters(1, 300);
            animateSequential(writers, 0);
        }

        // 慢速演示 — 重新创建 writer 使用慢速参数
        function slowAnimate() {
            writers = createWriters(0.5, 500);
            animateSequential(writers, 0);
        }

        // 练习模式 — 按顺序逐字练习
        function quizMode() {
            writers = createWriters(1, 300);
            startQuiz(0);
        }

        function startQuiz(index) {
            if (index >= writers.length) {
                alert('🎉 所有字都练习完成！');
                return;
            }
            writers[index].quiz({
                onMistake: function(strokeData) {
                    console.log('❌ 第' + (index+1) + '字 笔画错误: ' + strokeData.strokeNum);
                },
                onCorrectStroke: function(strokeData) {
                    console.log('✅ 第' + (index+1) + '字 正确笔画: ' + strokeData.strokeNum);
                },
                onComplete: function(summaryData) {
                    if (summaryData.mistakes === 0) {
                        console.log('🎉 第' + (index+1) + '字完美！');
                    }
                    startQuiz(index + 1);
                }
            });
        }

        // 重置
        function reset() {
            writers = createWriters(1, 300);
        }

        // 页面加载后自动演示
        setTimeout(function() {
            animateSequential(writers, 0);
        }, 800);
    </script>
</body>
</html>
